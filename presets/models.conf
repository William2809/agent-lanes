# Model presets: the only place model names live. Tools ask for a preset by name (`wk -m NAME`,
# pipeline roles), never for a model. Override or add presets in ~/.config/agent-lanes/models.conf
# (same format; a later line with the same name wins). Update when a new frontier model ships:
# see skills/model-presets/SKILL.md.
#
# name         model          effort   sandbox(max)     route
#   sandbox(max): the most this preset may use: read-only | workspace-write | full-access
#   route:        codex = plain Codex CLI; anything else = a Codex profile name (e.g. a proxy)
#
# Roles used by the tools (keep these names):
build          gpt-6.1-sol    medium   full-access      codex
build-light    gpt-6.1-sol    low      full-access      codex
build-hard     gpt-6.1-sol    high     full-access      codex
build-max      gpt-6.1-sol    xhigh    full-access      codex
review         gpt-6-astra    high     read-only        codex
review-light   gpt-6-astra    medium   read-only        codex
