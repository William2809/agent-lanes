# .wt-dev.conf: optional per-repo settings for wt-dev (commit it; sourced as shell).
# Everything here is optional: wt-dev detects common frameworks, lockfiles and databases itself.

# App folder (default: the first of apps/web, web, the root with a known framework).
#WT_DEV_APP=apps/web

# Dev server command, run with sh in the app folder; PORT is set. Needed for stacks without a preset:
#WT_DEV_CMD='go run ./cmd/server'                      # Go: read PORT in your code
#WT_DEV_CMD='cargo run'                                # Rust
#WT_DEV_CMD='npm run dev'                              # Express, Fastify, Hono, NestJS (read process.env.PORT)
#WT_DEV_CMD='uv run uvicorn app.main:app --port "$PORT"'   # FastAPI
#WT_DEV_CMD='uv run flask --app app run --port "$PORT"'    # Flask
#WT_DEV_READY_TIMEOUT=90                               # seconds until the port must listen
#WT_DEV_READY_ANY=1                                   # the listener is another process (e.g. docker compose up)

# Install command(s), one per line (default: from the lockfiles; set to "" for none).
#WT_DEV_INSTALL='pnpm install --frozen-lockfile --prefer-offline'

# Build caches deleted when an idle server sleeps (dirs under the app folder; default: the preset's).
#WT_DEV_CACHE='.next'

# .env variables pointed at the lane's own URL (default: BETTER_AUTH_URL NEXTAUTH_URL AUTH_URL; Laravel adds APP_URL).
#WT_DEV_URL_VARS='AUTH_URL PUBLIC_ORIGIN'

# Database. Built in for a localhost URL in .env: PostgreSQL (createdb + pg_dump/pg_restore),
# MySQL/MariaDB (mysqldump | mysql), SQLite (file copy). The variable holding it:
#WT_DEV_DB_VAR=DATABASE_URL                            # Laravel 11: DB_URL
# Anything else: your own commands. CLONE runs in the new worktree with WT_DEV_NAME, WT_DEV_WORKTREE and
# WT_DEV_SOURCE_URL set, and prints the copy's URL as its last line (nothing = keep the URL as is).
# DROP runs after the worktree is removed, with WT_DEV_NAME and WT_DEV_DB_URL set.
#WT_DEV_DB_CLONE='mongodump --uri="$WT_DEV_SOURCE_URL" --archive | mongorestore --uri="mongodb://localhost" --archive --nsFrom="app.*" --nsTo="app_$WT_DEV_NAME.*" --quiet && echo "mongodb://localhost/app_$WT_DEV_NAME"'
#WT_DEV_DB_DROP='mongosh --quiet "$WT_DEV_DB_URL" --eval "db.dropDatabase()"'

# Optional land baseline: run once on the stack tip; commit only these space-separated paths.
# Changes to other tracked files fail. Unset LAND_BASELINE_CMD skips the step.
# LAND_BASELINE_CMD='your baseline update command'
# LAND_BASELINE_FILES='path/to/baseline.json'
