# remote-ci: heavy checks on the runner machine (see ~/.claude/skills/remote-ci/SKILL.md).
# Sourced by bash on the dev machine and on the runner; exports here apply to the check run.
REMOTE_CI_NAME=__NAME__
REMOTE_CI_CHECK="pnpm run check"
# Optional toolchain; leave unset to use what the runner already has.
REMOTE_CI_NODE=24.19.0
REMOTE_CI_PNPM=10.33.4
# Optional Postgres (major version). A fresh database per run; its URL goes into DATABASE_URL.
#REMOTE_CI_POSTGRES=18
#REMOTE_CI_DB_CLEAN='myapp_test_%'   # databases the tests create; dropped after every run
# Runs after checkout (and after the database is created), before the check.
REMOTE_CI_PREPARE="pnpm install --frozen-lockfile --reporter=silent"
# .env keys copied to the runner (mode 600, never printed); * is a wildcard.
#REMOTE_CI_ENV_KEYS="R2_*"
#REMOTE_CI_TIMEOUT=1500  # per install, template build, prepare and check command

# Opt-in parallel slots (default 1 retains the global exclusive runner).
#REMOTE_CI_SLOTS=2
# Each slot uses its own checkout, CI DB and DB owner; tests must use DATABASE_URL.
# Optional split install/template prepare; remove install/migrate/seed from PREPARE
# when using these commands, leaving only work required for every run.
#REMOTE_CI_INSTALL="pnpm install --frozen-lockfile --reporter=silent"
#REMOTE_CI_INSTALL_INPUTS="pnpm-lock.yaml pnpm-workspace.yaml :(glob)**/package.json .npmrc patches"
#REMOTE_CI_TEMPLATE_INPUTS="path/to/migrations path/to/seed-and-imports pnpm-lock.yaml"
#REMOTE_CI_DB_PREPARE="pnpm db:migrate && pnpm db:seed"
#export VITEST_MAX_WORKERS=5
# Pass worker env through Turbo and size total workers across concurrent packages.

# Database URL export name (default DATABASE_URL; template first, then run database).
#REMOTE_CI_DATABASE_URL_VAR=DATABASE_URL
# Base DB name (default sanitized REMOTE_CI_NAME + _ci; parallel slots add _s<N>).
#REMOTE_CI_DB=myapp_ci
# --summary log filter; timeout/busy/timing/finished/memory lines are also included.
#REMOTE_CI_SUMMARY_PATTERN='Test Files|Tests  |FAIL |error TS|ERR_|Failed:|✖|passed|failed|Error:'
